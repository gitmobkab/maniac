name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.2.0)"
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Odin
        run: |
          curl -sL https://github.com/odin-lang/Odin/releases/download/dev-2026-07a/odin-linux-amd64-dev-2026-07a.tar.gz -o odin.tar.gz
          mkdir -p /tmp/odin
          tar -xzf odin.tar.gz -C /tmp/odin --strip-components=1
          echo "/tmp/odin" >> $GITHUB_PATH
      - name: Get version
        id: ver
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ]; then RAW="$GITHUB_REF_NAME"; fi
          echo "version=${RAW#v}" >> $GITHUB_OUTPUT
      - name: Build
        run: odin build . -out:maniac-linux -o:speed -define:VERSION=${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: maniac-linux
          path: maniac-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Odin
        run: |
          Invoke-WebRequest -Uri "https://github.com/odin-lang/Odin/releases/download/dev-2026-07a/odin-windows-amd64-dev-2026-07a.zip" -OutFile odin.zip
          Expand-Archive odin.zip -DestinationPath C:\odin_extract
          $dir = Get-ChildItem -Path C:\odin_extract -Directory | Select-Object -First 1
          echo "$($dir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Get version
        id: ver
        shell: bash
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ]; then RAW="$GITHUB_REF_NAME"; fi
          echo "version=${RAW#v}" >> $GITHUB_OUTPUT
      - name: Build
        run: odin build . -out:maniac-windows.exe -o:speed -define:VERSION=${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: maniac-windows
          path: maniac-windows.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Get version
        id: ver
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ]; then RAW="$GITHUB_REF_NAME"; fi
          echo "version=${RAW#v}" >> $GITHUB_OUTPUT
      - name: Extract changelog entry
        id: changelog
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            BEGIN{found=0}
            /^## \[/{ if(found) exit; if($0 ~ "\\[" ver "\\]") found=1; next }
            found{print}
          ' CHANGELOG.md > release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog**: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> release_notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: |
            artifacts/maniac-linux/maniac-linux
            artifacts/maniac-windows/maniac-windows.exe